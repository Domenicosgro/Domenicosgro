services:
  komplizen-protokolle:
    image: komplizen-protokolle:latest
    container_name: komplizen-protokolle
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /volume1/docker/komplizen-protokolle/data:/data
      - /volume1/docker/komplizen-protokolle/logs:/logs
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      PUBLIC_URL: "http://192.168.178.250:3000"
      DB_PATH: "/data"
      LOG_PATH: "/logs"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "DEINE-GMAIL@googlemail.com"
      SMTP_PASS: "DEIN-APP-PASSWORT-HIER"
      SMTP_FROM: "DEINE-GMAIL@googlemail.com"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
