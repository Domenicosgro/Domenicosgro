services:
  komplizen-protokolle:
    image: komplizen-protokolle:latest
    container_name: komplizen-protokolle
    restart: unless-stopped
    # Speicher-Obergrenze: schützt den NAS-Host, falls dieser Container zu viel RAM
    # zieht (Speicherleck oder viele parallele Uploads). Bei Überschreitung wird nur
    # DIESER Container per OOM neu gestartet (restart:unless-stopped), nicht die NAS.
    # Muss über dem größten erwarteten Einzel-Upload liegen (Video/BIM werden beim
    # Upload komplett im RAM gepuffert). 2 GB reicht für Videos bis ~1,5 GB; bei
    # größeren Videos oder knappem NAS-RAM entsprechend anpassen.
    mem_limit: 2g
    ports:
      - "3000:3000"
    volumes:
      - /volume1/docker/komplizen-protokolle/data:/data
      - /volume1/docker/komplizen-protokolle/logs:/logs
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      PUBLIC_URL: "http://192.168.178.250:3000"
      DB_PATH: "/data"
      LOG_PATH: "/logs"
      # ── Synology-Authentifizierung ──────────────────────────────────────────
      # Wenn gesetzt: Synology-DSM-Benutzer können sich direkt anmelden.
      # URL = HTTP-Adresse der NAS inkl. Port (Standard-DSM-Ports: 5000=HTTP, 5001=HTTPS)
      # SYNOLOGY_ADMIN_GROUP: Synology-Gruppe, die App-Admin-Rechte erhält (Standard: administrators)
      # SYNOLOGY_ADMIN_USERS: Kommaliste fester Admin-Benutzernamen (Fallback, falls Group-API nicht verfügbar)
      SYNOLOGY_URL:        "http://192.168.178.250:5000"
      # SYNOLOGY_ADMIN_GROUP: "administrators"
      # SYNOLOGY_ADMIN_USERS: ""
      # ── E-Mail-Versand via Microsoft Graph (OAuth2) ──────────────────────────
      # Bevorzugter Weg: kein Passwort, keine MFA, kein Konflikt mit den
      # Microsoft-365-Sicherheitsstandards. Werte aus der in Entra registrierten
      # App (Anwendungsberechtigung "Mail.Send" mit Admin-Zustimmung).
      # GRAPH_CLIENT_SECRET niemals in Git committen – nur lokal auf der NAS!
      GRAPH_TENANT_ID:     "DEINE-TENANT-ID-HIER"
      GRAPH_CLIENT_ID:     "DEINE-CLIENT-ID-HIER"
      GRAPH_CLIENT_SECRET: "DEIN-CLIENT-SECRET-HIER"
      GRAPH_SENDER:        "Protokoll@ghbarchitekten.de"
      SMTP_FROM:           "Protokoll@ghbarchitekten.de"
      # ── SMTP-Fallback (nur genutzt, wenn keine GRAPH_*-Variablen gesetzt sind) ─
      # Funktioniert mit den Sicherheitsstandards NICHT (Basic-Auth gesperrt).
      # SMTP_HOST:   "smtp.office365.com"
      # SMTP_PORT:   "587"
      # SMTP_SECURE: "false"
      # SMTP_USER:   "Protokoll@ghbarchitekten.de"
      # SMTP_PASS:   "DEIN-PASSWORT-HIER"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
