services:
  komplizen-protokolle:
    build: .
    image: komplizen-protokolle:latest
    container_name: komplizen-protokolle
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/logs
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      # API_KEY: "ersetze-durch-sicheren-zufallsschluessel"
      # ALLOWED_ORIGINS: "https://protokoll.meinefirma.de"
      # HTTPS_CERT: "/certs/fullchain.pem"
      # HTTPS_KEY: "/certs/privkey.pem"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
