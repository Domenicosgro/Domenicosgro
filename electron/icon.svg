<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#1a1a2e" stroke="#c0a060" stroke-width="8"/>

  <!-- Mask face - main shape -->
  <ellipse cx="256" cy="270" rx="145" ry="165" fill="#2a2a3e" stroke="#c0a060" stroke-width="4"/>

  <!-- Forehead / top of mask -->
  <path d="M 140 200 Q 180 110 256 105 Q 332 110 372 200 Z" fill="#1a1a2e" stroke="#c0a060" stroke-width="3"/>

  <!-- Hat brim -->
  <rect x="105" y="145" width="302" height="22" rx="8" fill="#111" stroke="#c0a060" stroke-width="3"/>

  <!-- Hat body -->
  <path d="M 145 145 Q 150 60 256 55 Q 362 60 367 145 Z" fill="#111" stroke="#c0a060" stroke-width="3"/>

  <!-- Hat band -->
  <rect x="145" y="120" width="222" height="28" rx="3" fill="#c0a060" opacity="0.85"/>

  <!-- Left eye hole -->
  <ellipse cx="205" cy="240" rx="38" ry="28" fill="#1a1a2e" stroke="#c0a060" stroke-width="3"/>
  <!-- Left eye inner shadow -->
  <ellipse cx="205" cy="243" rx="28" ry="20" fill="#0a0a1a"/>
  <!-- Left eye glint -->
  <ellipse cx="195" cy="233" rx="8" ry="5" fill="#c0a060" opacity="0.4"/>

  <!-- Right eye hole -->
  <ellipse cx="307" cy="240" rx="38" ry="28" fill="#1a1a2e" stroke="#c0a060" stroke-width="3"/>
  <!-- Right eye inner shadow -->
  <ellipse cx="307" cy="243" rx="28" ry="20" fill="#0a0a1a"/>
  <!-- Right eye glint -->
  <ellipse cx="297" cy="233" rx="8" ry="5" fill="#c0a060" opacity="0.4"/>

  <!-- Nose bridge -->
  <path d="M 240 265 Q 256 300 272 265" fill="none" stroke="#c0a060" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Smirk / mouth -->
  <path d="M 200 335 Q 225 360 256 355 Q 287 360 312 335" fill="none" stroke="#c0a060" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cheek decorations - ornamental lines -->
  <path d="M 145 285 Q 168 295 188 285" fill="none" stroke="#c0a060" stroke-width="2" opacity="0.7"/>
  <path d="M 324 285 Q 344 295 367 285" fill="none" stroke="#c0a060" stroke-width="2" opacity="0.7"/>

  <!-- Chin point subtle -->
  <path d="M 200 395 Q 256 430 312 395" fill="none" stroke="#c0a060" stroke-width="2" opacity="0.5"/>

  <!-- Golden accent dots on hat band -->
  <circle cx="220" cy="134" r="5" fill="#1a1a2e"/>
  <circle cx="256" cy="134" r="5" fill="#1a1a2e"/>
  <circle cx="292" cy="134" r="5" fill="#1a1a2e"/>
</svg>
